<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>案場資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--navy:#0c2b15;--blue:#197a56;--cyan:#96f878;--ink:#212427;--mute:#696969;--rule:#d4d4d4;--soft:#f2f2f2;--warm:#f1eeea;--white:#fff;
--serif:"Palatino Linotype",Palatino,"Noto Serif TC",Georgia,serif;--sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font:15px/1.6 var(--sans)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 登入 */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-side{background:var(--navy);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:flex-end}
.login-side h1{font:500 44px/1.2 var(--serif);margin:0 0 16px}
.login-side p{color:#b8c4ce;margin:0;max-width:30em}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-form form{width:100%;max-width:340px}
.login-form h2{font:500 26px var(--serif);color:var(--navy);margin:0 0 28px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:18px}
label input{display:block;width:100%;margin-top:4px;padding:9px 0;border:0;border-bottom:1px solid var(--navy);background:none;font-size:16px;color:var(--ink)}
.btn{background:var(--navy);color:#fff;border:0;padding:11px 22px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--blue)}
.login-form .btn{width:100%;margin-top:8px}
.err{color:#b42318;font-size:13px;min-height:20px;margin:10px 0 0}
/* 版面 */
.top{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 40px}
.top b{font:500 18px var(--serif)}
.top nav{display:flex;gap:24px;margin:0 auto 0 40px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:#b8c4ce;padding:4px 0;cursor:pointer}
.tab[aria-current=page]{color:#fff;border-bottom-color:var(--cyan)}
.jump{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-align:left;font-size:13px}
.filters.c{grid-template-columns:2fr repeat(3,1fr)}
.filters.k{grid-template-columns:2fr 1fr}
.mapwrap{display:grid;grid-template-columns:1fr 320px;gap:20px;height:calc(100vh - 300px);min-height:460px}
#map{height:100%;border:1px solid var(--rule);z-index:0}
.mlist{overflow:auto;border-top:1px solid var(--navy);margin:0;padding:0;list-style:none}
.mlist li{border-bottom:1px solid var(--rule)}
.mlist button{display:block;width:100%;background:none;border:0;text-align:left;padding:8px 4px;cursor:pointer;font-size:13px}
.mlist button:hover{background:var(--soft)}
.mlist small{display:block;color:var(--mute)}
.pop b{display:block;color:var(--navy);font-size:14px}.pop span{display:block;color:var(--mute);margin-bottom:6px}
.pop .jump{display:block;margin-top:4px}
.pop a{font-size:13px}
.scrim{z-index:2000}.drawer{z-index:2001}
.link{background:none;border:0;color:inherit;cursor:pointer;text-decoration:underline;font-size:13px;padding:4px}
main{max-width:1360px;margin:0 auto;padding:36px 40px 64px}
.title{font:500 30px/1.3 var(--serif);color:var(--navy);margin:0 0 6px;max-width:32em}
.sub{color:var(--mute);margin:0 0 28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--navy);border-bottom:1px solid var(--rule);margin-bottom:32px}
.kpi{padding:16px 20px 16px 0}
.kpi+.kpi{border-left:1px solid var(--rule);padding-left:20px}
.kpi strong{display:block;font:500 32px/1.2 var(--serif);color:var(--navy)}
.kpi span{font-size:13px;color:var(--mute)}
.exhibit{font-size:12px;letter-spacing:.08em;color:var(--blue);font-weight:700;margin:0}
h2.ex{font:500 19px var(--serif);color:var(--navy);margin:2px 0 14px}
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:12px;margin-bottom:14px}
.filters label{margin:0;font-size:12px}
.filters input,.filters select{display:block;width:100%;margin-top:2px;padding:7px 4px;border:0;border-bottom:1px solid var(--rule);background:#fff;font-size:14px;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px;gap:12px}
.tw{overflow-x:auto;border-top:1px solid var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:700;color:var(--navy);text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--navy);white-space:nowrap;cursor:pointer;font-size:13px}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;font-size:13px}
.pager button{background:none;border:1px solid var(--rule);padding:4px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.foot{margin-top:28px;font-size:12px;color:var(--mute);border-top:1px solid var(--rule);padding-top:10px}
/* 明細 */
.scrim{position:fixed;inset:0;background:rgba(5,28,44,.45)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:#fff;overflow:auto;padding:32px 36px 48px}
.drawer h2{font:500 26px/1.3 var(--serif);color:var(--navy);margin:0}
.drawer h3{font:700 13px var(--sans);color:var(--blue);letter-spacing:.04em;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--navy)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.dl div{padding:7px 0;border-bottom:1px solid var(--rule);min-width:0;overflow-wrap:anywhere}
.dl dt{font-size:12px;color:var(--mute)}
.dl dd{margin:0}
.dl .full{grid-column:1/-1}
.drawer table{font-size:13px}
.empty{color:var(--mute);font-size:13px;margin:0}
/* 視覺語言：深綠＋亮綠點綴、細體襯線標題、圓角卡片、膠囊按鈕 */
.login-side{border-radius:0 32px 32px 0}
.login-side h1{font-weight:300;font-size:56px}
.login-form h2{font-weight:300;font-size:32px}
label input{border:0;border-radius:10px;background:var(--soft);padding:12px 14px;margin-top:6px}
.btn{background:var(--cyan);color:var(--navy);border-radius:999px;font-weight:700;padding:13px 28px}
.btn:hover{background:#7fe563}
.top{position:sticky;top:12px;z-index:1000;margin:12px 24px 0;background:var(--soft);color:var(--ink);border-radius:18px;padding:10px 24px}
.top b{font-weight:400;font-size:20px;color:var(--navy)}
.tab{border:0;border-radius:999px;padding:7px 16px;color:var(--ink);font-size:14px}
.tab:hover{background:#e3e3e3}
.tab[aria-current=page]{background:var(--navy);color:#fff}
.top nav{gap:6px}
.dl-tab{text-decoration:none;display:inline-flex;align-items:center}
.title{font-weight:300;font-size:40px;line-height:1.25}
.sub{font-size:16px}
.kpis{background:var(--navy);border:0;border-radius:24px;padding:12px 32px;color:#fff}
.kpi strong{color:var(--cyan);font-weight:300;font-size:40px}
.kpi span{color:rgba(255,255,255,.75)}
.kpi+.kpi{border-left-color:rgba(255,255,255,.2)}
h2.ex{font-weight:300;font-size:26px;margin:0 0 16px}
.filters{background:var(--warm);border-radius:20px;padding:16px 20px}
.filters label{color:var(--mute)}
.filters input,.filters select{border:0;border-radius:10px;padding:9px 10px;margin-top:4px}
.tw{border-top:0}
th{border-bottom:1px solid var(--navy);padding:10px 14px 10px 0}
td{padding:11px 14px 11px 0}
tbody tr.row:hover{background:var(--warm)}
.link{color:var(--blue);font-weight:500}
.top .link{color:var(--ink)}
.pager button{border:1px solid var(--navy);border-radius:999px;padding:6px 18px;color:var(--navy)}
.pager button:hover:not(:disabled){background:var(--navy);color:#fff}
.foot{border-top:0;background:var(--soft);border-radius:12px;padding:12px 16px}
.drawer{border-radius:28px 0 0 28px}
.drawer h2{font-weight:300;font-size:32px}
.drawer h3{color:var(--navy);font-size:14px;letter-spacing:0;border-bottom:1px solid var(--rule)}
.drawer a,.pop a{color:var(--blue)}
.scrim{background:rgba(12,43,21,.5)}
#map{border:0;border-radius:20px}
.mlist{border-top:0;background:var(--warm);border-radius:20px;padding:6px 12px}
.mlist li{border-bottom-color:var(--rule)}
.mlist button:hover{background:#e7e2db}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(150,248,120,.55)}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:var(--navy);color:#fff}
@media(max-width:900px){
 .login-side{border-radius:0 0 28px 28px}.login-side h1{font-size:36px}
 .top{margin:8px 8px 0;border-radius:16px;padding:10px 14px}
 .top nav{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}
 .title{font-size:28px}.kpis{padding:8px 20px}.kpi strong{font-size:30px}
 .drawer{border-radius:0}
 .login{grid-template-columns:1fr}.login-side{padding:32px 16px}.login-side h1{font-size:30px}
 .top{padding:12px 16px;flex-wrap:wrap;gap:8px}.top nav{order:3;margin:0;width:100%}.filters.c,.filters.k{grid-template-columns:1fr 1fr}.mapwrap{grid-template-columns:1fr;height:auto}#map{height:60vh}.mlist{max-height:320px}main{padding:24px 16px 48px}.title{font-size:24px}
 .kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0;padding-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--rule)}
 .filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}
 .drawer{padding:24px 16px}.dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<section class="login" id="loginView" hidden>
  <div class="login-side"><h1>案場資料庫</h1><p>維運案場的基本資料、聯絡窗口與電號。僅限授權管理者使用。</p></div>
  <div class="login-form">
    <form id="loginForm">
      <h2>管理者登入</h2>
      <label>帳號<input id="user" autocomplete="username" required></label>
      <label>密碼<input id="pass" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="loginBtn">登入</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </div>
</section>

<div id="appView" hidden>
  <header class="top"><b>案場資料庫</b>
    <nav aria-label="功能"><button class="tab" id="tabContracts">合約查詢</button><button class="tab" id="tabSites" aria-current="page">案場查詢</button><button class="tab" id="tabCustomers">客戶查詢</button><button class="tab" id="tabMap">案場地圖</button><a class="tab dl-tab" href="https://drive.google.com/drive/folders/1E79klqsGGVgJU1J204UhHR1TG4RDuaQM" target="_blank" rel="noopener">資料庫下載</a></nav>
    <button class="link" id="logout">登出</button></header>
  <main id="customersView" hidden>
    <h1 class="title" id="kHeadline">載入中</h1>
    <p class="sub" id="kSubline"></p>
    <div class="kpis" id="kKpis"></div>
        <h2 class="ex">客戶清單（點選列可看合約與案場）</h2>
    <div class="filters k">
      <label class="q">搜尋<input id="kq" type="search" placeholder="客戶編號、名稱、統編、地址、窗口"></label>
      <label>範圍<select id="kScope"><option value="linked">有合約或案場的客戶</option><option value="">全部客戶</option></select></label>
    </div>
    <div class="bar"><span id="kCount"></span><button class="link" id="kCsv">匯出 CSV</button></div>
    <div class="tw"><table><thead><tr id="kThead"></tr></thead><tbody id="kTbody"></tbody></table></div>
    <div class="pager"><button id="kPrev">上一頁</button><span id="kPage"></span><button id="kNext">下一頁</button></div>
    <p class="foot" id="kFoot"></p>
  </main>
  <main id="mapView" hidden>
    <h1 class="title" id="mHeadline">案場地圖</h1>
    <p class="sub" id="mSubline"></p>
    <div class="filters">
      <label class="q">搜尋<input id="mq" type="search" placeholder="編號、名稱、客戶、地址"></label>
      <label>有效合約<select id="mContract"></select></label>
      <label>屬性<select id="mSource"></select></label>
      <label>類型<select id="mType"></select></label>
      <label>負責工程師<select id="mEng"></select></label>
      <label>分區<select id="mArea"></select></label>
    </div>
    <div class="mapwrap"><div id="map" role="application" aria-label="案場地圖"></div><ul class="mlist" id="mList"></ul></div>
    <p class="foot" id="mFoot"></p>
  </main>
  <main id="contractsView" hidden>
    <h1 class="title" id="cHeadline">載入中</h1>
    <p class="sub" id="cSubline"></p>
    <div class="kpis" id="cKpis"></div>
        <h2 class="ex">合約清單（點選列可看明細）</h2>
    <div class="filters c">
      <label class="q">搜尋<input id="cq" type="search" placeholder="合約編號、客戶、案場、保險編號"></label>
      <label>合約類型<select id="cType"></select></label>
      <label>合約狀態<select id="cStatus"></select></label>
      <label>到期<select id="cExpire"><option value="">全部</option><option value="90">90 天內到期</option><option value="180">180 天內到期</option><option value="365">一年內到期</option></select></label>
    </div>
    <div class="bar"><span id="cCount"></span><button class="link" id="cCsv">匯出 CSV</button></div>
    <div class="tw"><table><thead><tr id="cThead"></tr></thead><tbody id="cTbody"></tbody></table></div>
    <div class="pager"><button id="cPrev">上一頁</button><span id="cPage"></span><button id="cNext">下一頁</button></div>
    <p class="foot" id="cFoot"></p>
  </main>
  <main id="sitesView">
    <h1 class="title" id="headline">載入中</h1>
    <p class="sub" id="subline"></p>
    <div class="kpis" id="kpis"></div>
        <h2 class="ex">案場清單（點選列可看明細）</h2>
    <div class="filters">
      <label class="q">搜尋<input id="q" type="search" placeholder="編號、名稱、客戶、地址、電號"></label>
      <label>有效合約<select id="fContract"></select></label>
      <label>屬性<select id="fSource"></select></label>
      <label>類型<select id="fType"></select></label>
      <label>負責工程師<select id="fEng"></select></label>
      <label>分區<select id="fArea"></select></label>
    </div>
    <div class="bar"><span id="count"></span><button class="link" id="csv">匯出 CSV</button></div>
    <div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<div id="drawerWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="bar"><span id="dNo"></span><button class="link" id="dClose">關閉</button></div>
    <h2 id="dTitle" tabindex="-1"></h2>
    <div id="dBody"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const SB_URL='https://cowljafosekwvxithwjd.supabase.co';
const SB_KEY='sb_publishable_YP57cbbDJSP7-PvBgtKivA_25uDcp5n';
const LOGIN_DOMAIN='@acme-oss.example'; // 登入帳號對應 Supabase Auth 的 email
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:1});
const PAGE=50;
const COLS=[['field_no','編號'],['name','案場名稱'],['capacity','容量 kW',1],['customer','客戶'],['active_contract','有效合約'],['is_high_voltage','高壓'],['engineer','工程師'],['manager','管理師'],['area','分區'],['source','屬性'],['field_type','類型']];
const CCOLS=[['contract_no','合約編號'],['contract_type','類型'],['status','狀態'],['start_date','開始'],['end_date','結束'],['years','年限'],['customer','客戶'],['site_count','案場數',1]];
let all=[],view=[],pageNo=0,sortKey='field_no',sortDir=1,lastFocus=null;
let cAll=[],cView=[],cPageNo=0,cSortKey='end_date',cSortDir=1,contractsOfSite={};
const KCOLS=[['customer_no','客戶編號'],['name','客戶名稱'],['tax_id','統編'],['contract_count','合約數',1],['site_count','案場數',1],['capacity','容量 kW',1],['address','地址']];
let kRaw=[],kAll=[],kView=[],kPageNo=0,kSortKey='contract_count',kSortDir=-1;
let map=null,cluster=null,markers={},filesOf={};
function fileList(type,no){
  const fs=filesOf[type+':'+no]||[];
  const rows=fs.map(f=>{
    const size=f.size_bytes?` <small>${fmt(f.size_bytes/1048576)} MB</small>`:'';
    if(f.http_status!==200)return `<li>${esc(f.label)}${size} <small>（原系統檔案已損壞，未能複製）</small></li>`;
    if(f.copy_error)return `<li>${esc(f.label)}${size} <small>（複製失敗）</small></li>`;
    if(!f.copied_at)return `<li>${esc(f.label)}${size} <small>（複製中）</small></li>`;
    const url=f.drive_url||'https://drive.google.com/drive/search?q='+encodeURIComponent(f.file_name);
    return `<li><a href="${esc(url)}" target="_blank" rel="noopener">${esc(f.label)}</a>${size}</li>`;
  }).join('');
  return `<h3>附件（${fs.length}）</h3>`+(rows?`<ul style="margin:0;padding-left:18px">${rows}</ul><p class="empty" style="margin-top:6px">存放於 Google 雲端硬碟，需登入有權限的帳號。</p>`:'<p class="empty">無資料</p>');
}

function showLogin(){$('loginView').hidden=false;$('appView').hidden=true}
async function showApp(){
  $('loginView').hidden=true;$('appView').hidden=false;
  const {data,error}=await sb.from('oss_sites').select('*').order('field_no');
  if(error){$('headline').textContent='資料載入失敗';$('subline').textContent=error.message;return}
  if(!data.length){$('headline').textContent='此帳號沒有讀取權限';$('subline').textContent='請確認帳號已列入管理者名單。';return}
  all=data.map(r=>({...r,_s:[r.field_no,r.name,r.customer,r.address,JSON.stringify(r.electric_nos)].join(' ').toLowerCase()}));
  initFilters();summary();apply();
  switchTab('contracts');
  loadContracts();
}
async function fetchAll(table,cols){
  let out=[];
  for(let i=0;;i+=1000){
    const {data,error}=await sb.from(table).select(cols).range(i,i+999);
    if(error)throw error;
    out=out.concat(data);
    if(data.length<1000)return out;
  }
}
async function loadContracts(){
  try{
    const [cs,links,ks,fs]=await Promise.all([fetchAll('oss_contracts','*'),fetchAll('oss_contract_sites','*'),fetchAll('oss_customers','*'),fetchAll('oss_files','owner_type,owner_no,label,file_name,drive_url,copied_at,copy_error,size_bytes,http_status')]);
    kRaw=ks;
    filesOf={};fs.forEach(f=>{const k=f.owner_type+':'+f.owner_no;(filesOf[k]=filesOf[k]||[]).push(f)});

$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('loginErr').textContent='';$('loginBtn').disabled=true;
  const u=$('user').value.trim();
  const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+LOGIN_DOMAIN,password:$('pass').value});
  $('loginBtn').disabled=false;$('pass').value='';
  if(error){$('loginErr').textContent='帳號或密碼不正確';return}
  showApp();
};
$('logout').onclick=async()=>{await sb.auth.signOut();all=[];showLogin()};
$('q').oninput=()=>{pageNo=0;apply()};
$('thead').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}apply()};
$('tbody').onclick=e=>{const t=e.target.closest('tr.row');if(t)openD(t.dataset.no)};
$('tbody').onkeydown=e=>{if(e.key==='Enter'){const t=e.target.closest('tr.row');if(t)openD(t.dataset.no)}};
$('prev').onclick=()=>{pageNo--;render()};$('next').onclick=()=>{pageNo++;render()};
$('csv').onclick=()=>csv(COLS,view,'案場資料.csv');
$('tabSites').onclick=()=>switchTab('sites');$('tabContracts').onclick=()=>switchTab('contracts');
$('cq').oninput=()=>{cPageNo=0;cApply()};
$('cThead').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;if(cSortKey===k)cSortDir=-cSortDir;else{cSortKey=k;cSortDir=1}cApply()};
$('cTbody').onclick=e=>{const t=e.target.closest('tr.row');if(t)openC(t.dataset.no)};
$('cTbody').onkeydown=e=>{if(e.key==='Enter'){const t=e.target.closest('tr.row');if(t)openC(t.dataset.no)}};
$('cPrev').onclick=()=>{cPageNo--;cRender()};$('cNext').onclick=()=>{cPageNo++;cRender()};
$('cCsv').onclick=()=>csv(CCOLS,cView,'合約資料.csv');
$('dBody').onclick=e=>{const b=e.target.closest('.jump');if(!b)return;if(b.dataset.site)openD(b.dataset.site);else if(b.dataset.customer)openK(b.dataset.customer);else openC(b.dataset.contract)};
$('tabCustomers').onclick=()=>switchTab('customers');$('tabMap').onclick=()=>switchTab('map');
$('kq').oninput=()=>{kPageNo=0;kApply()};$('kScope').onchange=()=>{kPageNo=0;kApply()};
$('kThead').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;if(kSortKey===k)kSortDir=-kSortDir;else{kSortKey=k;kSortDir=1}kApply()};
$('kTbody').onclick=e=>{const t=e.target.closest('tr.row');if(t)openK(t.dataset.no)};
$('kTbody').onkeydown=e=>{if(e.key==='Enter'){const t=e.target.closest('tr.row');if(t)openK(t.dataset.no)}};
$('kPrev').onclick=()=>{kPageNo--;kRender()};$('kNext').onclick=()=>{kPageNo++;kRender()};
$('kCsv').onclick=()=>csv(KCOLS,kView,'客戶資料.csv');
$('mList').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=markers[b.dataset.no];cluster.zoomToShowLayer(m,()=>m.openPopup())};
$('dClose').onclick=closeD;$('scrim').onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('drawerWrap').hidden)closeD()});
sb.auth.getSession().then(({data})=>data.session?showApp():showLogin());
</script>
</body>
</html>
